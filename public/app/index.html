<!DOCTYPE html>
<!--
  Saurion Gaming — eFootball Player Training Guide
  Pure HTML5 / CSS3 / Vanilla JS. No frameworks, no build step.
  Files: index.html · styles.css · script.js · assets/{icons,images}
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saurion Gaming · eFootball Player Training Guide</title>
    <meta
      name="description"
      content="Premium eFootball player training guide builder by Saurion Gaming: edit progression, stats, skills and export as PNG."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Fonts + Icons (only external dependencies) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ===== Animated neon background + particles + mouse-follow glow ===== -->
    <div class="bg-layer" aria-hidden="true"></div>
    <canvas id="particles" class="bg-particles" aria-hidden="true"></canvas>
    <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>

    <!-- ===== Toolbar ===== -->
    <header class="toolbar">
      <div class="toolbar__brand">
        <img src="assets/images/saurion-logo.png" alt="Saurion Gaming" />
        <span>Player Training Guide</span>
      </div>
      <div class="toolbar__actions">
        <button class="btn btn--primary" id="btnExport">
          <i class="fa-solid fa-image"></i> Export as PNG
        </button>
        <button class="btn" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> Save JSON</button>
        <label class="btn" for="loadJson"><i class="fa-solid fa-folder-open"></i> Load JSON</label>
        <input type="file" id="loadJson" accept="application/json" hidden />
        <button class="btn btn--danger" id="btnReset">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </header>

    <!-- ===== Dashboard (this whole node is what gets exported) ===== -->
    <main class="dashboard" id="dashboard">
      <!-- ---------- PLAYER CARD (top-left) ---------- -->
      <section class="card glass area-card tilt" aria-label="Player card">
        <h2 class="card__title"><i class="fa-solid fa-id-card"></i> Player Card</h2>
        <div class="cardimg" id="cardImageWrap">
          <!-- Default image path: assets/images/player-card.png (drop your own file with this name) -->
          <img id="cardImage" src="assets/images/player-card.png" alt="Player card" />
          <label class="cardimg__upload" for="cardUpload" title="Upload player card image">
            <i class="fa-solid fa-cloud-arrow-up"></i><span>Upload card image</span>
          </label>
          <input type="file" id="cardUpload" accept="image/*" hidden />
        </div>
      </section>

      <!-- ---------- PLAYER HEADER ---------- -->
      <section class="card glass area-header header" aria-label="Player header">
        <div class="header__top">
          <div class="header__ovr">
            <input class="edit edit--ovr" id="ovr" value="107" inputmode="numeric" />
            <input class="edit edit--pos" id="position" value="AMF" />
          </div>
          <div class="header__id">
            <input class="edit edit--name" id="playerName" value="Jude Bellingham" />
            <div class="header__sub">
              <input class="edit chip chip--cyan" id="playstyle" value="Hole Player" />
              <input class="edit chip chip--gold" id="cardType" value="Big Time England" />
              <input class="edit chip chip--pink" id="club" value="Real Madrid" />
            </div>
          </div>
        </div>
        <div class="header__meta" id="headerMeta">
          <!-- Meta pills injected by script.js (all editable) -->
        </div>
      </section>

      <!-- ---------- PROGRESSION (left column, under the card) ---------- -->
      <section class="card glass area-prog" aria-label="Player progression">
        <h2 class="card__title">
          <i class="fa-solid fa-arrow-up-right-dots"></i> Player Progression
        </h2>
        <div class="prog" id="progression"><!-- rows injected --></div>
      </section>

      <!-- ---------- STATISTICS (center) ---------- -->
      <section class="card glass area-stats" aria-label="Statistics">
        <h2 class="card__title"><i class="fa-solid fa-chart-simple"></i> Statistics</h2>
        <div class="stats" id="stats"><!-- groups injected --></div>
      </section>

      <!-- ---------- MANAGER + BOOSTERS (under statistics, equal height) ---------- -->
      <div class="mgrrow">
      <section class="card glass area-manager" aria-label="Manager">
        <h2 class="card__title"><i class="fa-solid fa-people-group"></i> Manager</h2>
        <div class="manager">
          <div class="manager__row">
            <span class="manager__label">Manager Proficiency</span>
            <input class="edit edit--num" id="mgrValue" value="89" inputmode="numeric" />
          </div>
          <div class="bar"><span class="bar__fill" id="mgrBar"></span></div>
        </div>
      </section>

      <!-- ---------- BOOSTERS (under statistics, next to manager) ---------- -->
      <section class="card glass area-boost" aria-label="Boosters">
        <h2 class="card__title"><i class="fa-solid fa-bolt"></i> Boosters</h2>
        <div class="boosters">
          <div class="booster">
            <span class="booster__icon booster__icon--1"><i class="fa-solid fa-bolt"></i></span>
            <select class="edit select" id="booster1">
              <option>Technique</option>
              <option>Hard Worker</option>
              <option>Fantasista</option>
              <option>Physical Strength</option>
              <option>Speeding Bullet</option>
              <option>Sharp Shooter</option>
            </select>
            <select class="edit select select--sm" id="booster1Bonus">
              <option>+1</option>
              <option>+2</option>
              <option>+3</option>
              <option selected>+4</option>
              <option>+5</option>
            </select>
          </div>
          <div class="booster">
            <span class="booster__icon booster__icon--2"
              ><i class="fa-solid fa-plus"></i
            ></span>
            <select class="edit select" id="booster2">
              <option selected>Hard Worker</option>
              <option>Technique</option>
              <option>Fantasista</option>
              <option>Physical Strength</option>
              <option>Speeding Bullet</option>
              <option>Sharp Shooter</option>
            </select>
            <select class="edit select select--sm" id="booster2Bonus">
              <option>+1</option>
              <option>+2</option>
              <option selected>+3</option>
              <option>+4</option>
              <option>+5</option>
            </select>
          </div>
        </div>
      </section>
      </div>

      <!-- ---------- SKILLS (right column) ---------- -->
      <section class="card glass area-skills" aria-label="Skills">
        <h2 class="card__title"><i class="fa-solid fa-star"></i> Inbuilt Skills</h2>
        <div class="skills" id="inbuiltSkills"><!-- 10 slots injected --></div>

        <h2 class="card__title card__title--mt">
          <i class="fa-solid fa-plus"></i> Additional Skills
        </h2>
        <ol class="skills skills--list" id="additionalSkills"><!-- 5 slots injected --></ol>
      </section>

      <!-- ---------- BRAND FOOTER ---------- -->
      <footer class="card glass area-brand brand">
        <img class="brand__logo" src="assets/images/saurion-logo.png" alt="Saurion Gaming logo" />
        <nav class="brand__socials" aria-label="Saurion Gaming social links">
          <a class="soc soc--yt" href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
          <a class="soc soc--tw" href="#" aria-label="Twitch"><i class="fa-brands fa-twitch"></i></a>
          <a class="soc soc--kick" href="#" aria-label="Kick"><img src="assets/images/kick-logo.png" alt="Kick" /></a>
          <a class="soc soc--ig" href="#" aria-label="Instagram"
            ><i class="fa-brands fa-instagram"></i
          ></a>
          <a class="soc soc--fb" href="#" aria-label="Facebook"
            ><i class="fa-brands fa-facebook-f"></i
          ></a>
          <a class="soc soc--x" href="#" aria-label="X (Twitter)"
            ><i class="fa-brands fa-x-twitter"></i
          ></a>
        </nav>
      </footer>
    </main>

    <p class="hint">
      Shortcuts: <kbd>E</kbd> export · <kbd>S</kbd> save · <kbd>R</kbd> reset
    </p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
